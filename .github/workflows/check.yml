name: Validate distribution source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PowerShell syntax and encoding
        shell: powershell
        run: .\scripts\validate.ps1
      - name: Privacy and source tests
        shell: powershell
        run: |
          python scripts/privacy_scan.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: API unit tests
        shell: powershell
        run: |
          python -m pip install -r irodori-api/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location irodori-api
          python -m unittest discover -s tests -v
          $code = $LASTEXITCODE
          Pop-Location
          exit $code
